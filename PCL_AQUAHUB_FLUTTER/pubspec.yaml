name: pcl_aquahub
description: AquaHub Flutter Android app
publish_to: "none"
version: 0.1.0
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  go_router: ^6.0.0
  dio: ^5.0.0
  shared_preferences: ^2.0.0
  flutter_secure_storage: ^8.0.0
  google_maps_flutter: ^2.2.0
  geolocator: ^9.0.0
  cached_network_image: ^3.0.0
  shimmer: ^2.0.0
  lottie: ^1.0.0
  intl: ^0.18.0
  url_launcher: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
