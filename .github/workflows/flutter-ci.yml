name: Flutter CI

on:
  push:
    branches: [ main, develop, 'add/**' ]
    paths:
      - 'PCL_AQUAHUB_FLUTTER/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'PCL_AQUAHUB_FLUTTER/**'

jobs:
  analyze:
    name: Analyze Flutter Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PCL_AQUAHUB_FLUTTER

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Analyze code
        run: flutter analyze
      
      - name: Check formatting
        run: dart format --set-exit-if-changed .

  test:
    name: Run Flutter Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PCL_AQUAHUB_FLUTTER

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Run unit and widget tests
        run: flutter test --coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./PCL_AQUAHUB_FLUTTER/coverage/lcov.info
          flags: flutter
          fail_ci_if_error: false

  build_apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [ analyze, test ]
    defaults:
      run:
        working-directory: PCL_AQUAHUB_FLUTTER

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK (debug)
        run: flutter build apk --debug
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug.apk
          path: PCL_AQUAHUB_FLUTTER/build/app/outputs/flutter-apk/app-debug.apk
