<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Management - AquaHub Vendor</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="vendor-dashboard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <div class="nav-container">
        <div class="logo">
          <img src="assets/Untitled_design-removebg-preview.png" alt="AquaHub" class="logo-img">
        </div>
        <ul class="nav-menu">
          <li class="nav-item"><a href="vendor-dashboard.html" class="nav-link">Dashboard</a></li>
          <li class="nav-item"><a href="vendor-available-customers.html" class="nav-link">Available Orders</a></li>
          <li class="nav-item"><a href="vendor-fleet.html" class="nav-link">Fleet Management</a></li>
        </ul>
        <div class="nav-actions">
          <div class="user-info">
            <span class="user-name" id="userName">Loading...</span>
            <span class="user-type">Vendor</span>
          </div>
          <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="main-content">
    <div class="container">
      <section class="welcome-section">
        <h1>Fleet Management</h1>
        <p>Manage trucks, capacities and dispatch status.</p>
      </section>

      <section class="fleet-actions">
        <button class="action-btn" onclick="showAddTruckForm()">Add Truck</button>
      </section>

      <section class="fleet-stats">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-truck"></i></div>
            <div class="stat-info"><h3 id="truckCount">0</h3><p>Number of Trucks</p></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-clock"></i></div>
            <div class="stat-info"><h3 id="ordersInQueue">0</h3><p>Orders in Queue</p></div>
          </div>
        </div>
      </section>

      <section class="truck-list">
        <h2>Your Trucks</h2>
        <div id="trucksContainer"></div>
      </section>

      <!-- Add/Edit Truck Modal -->
      <div id="truckModal" class="modal">
        <div class="modal-content">
          <span class="close" onclick="closeTruckModal()">&times;</span>
          <h2 id="truckModalTitle">Add Truck</h2>
          <form id="truckForm">
            <input type="hidden" id="truckId" />
            <div class="form-group">
              <label>Truck Name</label>
              <input id="truckName" required />
            </div>
            <div class="form-group">
              <label>Capacity (liters)</label>
              <input id="truckCapacity" type="number" required min="1000" />
            </div>
            <div class="form-group">
              <label>Currently Dispatched?</label>
              <select id="truckDispatched"><option value="false">No</option><option value="true">Yes</option></select>
            </div>
            <div class="modal-buttons">
              <button type="button" class="cancel-btn" onclick="closeTruckModal()">Cancel</button>
              <button type="submit" class="confirm-btn">Save Truck</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container"><p>&copy; AquaHub</p></div>
  </footer>

  <script src="login.js"></script>
  <script src="vendor-fleet.js"></script>
</body>
</html>
